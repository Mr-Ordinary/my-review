<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>try{var t=localStorage.getItem("mr.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <title>阶段 · MyReview</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23262626'/%3E%3Crect x='16' y='16' width='13' height='13' rx='2' fill='%23fafafa'/%3E%3Crect x='35' y='16' width='13' height='13' rx='2' fill='%23fafafa'/%3E%3Crect x='16' y='35' width='13' height='13' rx='2' fill='%23fafafa'/%3E%3Crect x='35' y='35' width='13' height='13' rx='2' fill='%23fafafa'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/app.css?v=20261123a" />
  <style>[v-cloak] { display: none; }</style>
</head>
<body class="route-stages">
  <div class="layout" id="app" v-cloak>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon"><span class="brand-mark"><i></i><i></i><i></i><i></i></span></div>
        <div class="brand-text">
          <strong>myreview</strong>
          <span>面试练习工作台</span>
        </div>
      </div>
      <nav class="nav">
        <template v-for="item in navItems">
          <div v-if="item.section" class="nav-section">{{ item.section }}</div>
          <a v-else :href="item.href" class="nav-item" :class="{ active: item.route === 'stages' }">
            <span class="nav-icon" v-html="icon(item.icon, 17)"></span><span>{{ item.label }}</span>
          </a>
        </template>
      </nav>
      <div class="user-panel">
        <div class="user-card" role="button" tabindex="0" title="个人中心" @click="goProfile">
          <img v-if="avatarUrl" class="user-avatar-img" :src="avatarUrl" alt="" />
          <div v-else class="user-avatar">{{ userNick.charAt(0) }}</div>
          <div class="user-meta">
            <div class="user-name">{{ userNick }}</div>
            <div class="user-sub">@{{ (user && user.username) || '' }}</div>
          </div>
          <button type="button" class="user-menu-btn" title="退出登录" @click.stop="askLogout" v-html="icon('logout', 16)"></button>
        </div>
      </div>
    </aside>

    <main class="content">
      <div class="page-head">
        <div class="ph-main">
          <div class="eyebrow">Workspace</div>
          <h1>阶段</h1>
        </div>
        <div class="page-actions">
          <span class="muted num">{{ countText }}</span>
          <button type="button" class="btn btn-primary" @click="openCreate"><span class="ib" v-html="icon('plus', 15)"></span>新建阶段</button>
        </div>
      </div>

      <div v-if="loading" class="empty">
        <div class="empty-icon" v-html="icon('list', 22)"></div>
        <div class="empty-title">加载中…</div>
      </div>
      <div v-else-if="error" class="empty">
        <div class="empty-icon" v-html="icon('list', 22)"></div>
        <div class="empty-title">加载失败</div>
        <div class="muted">{{ error }}</div>
      </div>
      <template v-else>
        <!-- KPI 行：本周卷量 / 均分 / 待巩固 / 掌握率 -->
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-head">
              <div class="kpi-ic i-info" v-html="icon('chart', 14)"></div>
              <div>
                <div class="kpi-t">本周卷量</div>
                <div class="kpi-sub">对比上周</div>
              </div>
            </div>
            <div class="kpi-val-row">
              <b class="kpi-val">{{ kpi.papersThisWeek }}</b>
              <span class="delta" :class="weekDeltaCls">{{ weekDeltaText }}</span>
            </div>
            <div class="kpi-note">上周 <b>{{ kpi.papersLastWeek }}</b> 张</div>
            <div class="kpi-foot">
              <span>已交卷 <b>{{ kpi.gradedPaperCount }}</b></span>
              <span>待巩固 <b>{{ kpi.weakCount }}</b></span>
            </div>
          </div>
          <div class="kpi-card">
            <div class="kpi-head">
              <div class="kpi-ic i-accent" v-html="icon('star', 14)"></div>
              <div>
                <div class="kpi-t">均分</div>
                <div class="kpi-sub">已批改卷面均分</div>
              </div>
            </div>
            <div class="kpi-val-row">
              <b class="kpi-val">{{ fmtScore(kpi.averageScore) }}</b>
            </div>
            <div class="kpi-note">已批改 <b>{{ kpi.gradedPaperCount }}</b> 张</div>
            <div class="kpi-foot">
              <span>满分 <b>100</b></span>
              <span>口径 <b>Σ实得分</b></span>
            </div>
          </div>
          <div class="kpi-card">
            <div class="kpi-head">
              <div class="kpi-ic i-warn" v-html="icon('target', 14)"></div>
              <div>
                <div class="kpi-t">待巩固</div>
                <div class="kpi-sub">薄弱点，优先出卷</div>
              </div>
            </div>
            <div class="kpi-val-row">
              <b class="kpi-val">{{ kpi.weakCount }}</b>
              <span v-if="kpi.weakCount > 0" class="delta flat">→ 补弱卷</span>
              <span v-else class="delta up">→ 收尾</span>
            </div>
            <div class="kpi-note">已覆盖 <b>{{ kpi.coveredCount }}</b> / {{ kpi.knowledgeTotal }} 个点</div>
            <div class="kpi-foot">
              <span>已掌握 <b>{{ kpi.masteredCount }}</b></span>
              <span>未覆盖 <b>{{ kpi.knowledgeTotal - kpi.coveredCount }}</b></span>
            </div>
          </div>
          <div class="kpi-card">
            <div class="kpi-head">
              <div class="kpi-ic i-ok" v-html="icon('check', 14)"></div>
              <div>
                <div class="kpi-t">掌握率</div>
                <div class="kpi-sub">已覆盖点中已掌握</div>
              </div>
            </div>
            <div class="kpi-val-row">
              <b class="kpi-val">{{ masteryRate }}</b>
            </div>
            <div class="kpi-note">{{ kpi.masteredCount }} / {{ kpi.coveredCount }} 个已覆盖点</div>
            <div class="kpi-foot">
              <span>总点 <b>{{ kpi.knowledgeTotal }}</b></span>
              <span>待巩固 <b>{{ kpi.weakCount }}</b></span>
            </div>
          </div>
        </div>

        <!-- 阶段卡 -->
        <div class="stage-row" v-if="stages.length">
          <div class="stage-card" v-for="s in pageItems" :key="s.id" @click="openStage(s)">
            <div class="folder-ic" v-html="icon('folder', 16)"></div>
            <div class="st-title">{{ s.name }}</div>
            <div class="st-badges">
              <span class="status doing">进行中</span>
              <span v-if="s.hasSummary" class="status done">已有总结</span>
            </div>
            <div class="st-stats">
              <span>练习<b>{{ s.practiceCount }}</b></span>
              <span>卷<b>{{ s.paperCount }}</b></span>
              <span>题<b>{{ s.questionCount }}</b></span>
              <span v-if="s.averageScore != null">均分<b>{{ fmtScore(s.averageScore) }}</b></span>
            </div>
            <div class="st-foot">更新于 {{ fmtTime(s.updatedAt) }}</div>
            <button type="button" class="btn btn-ghost btn-sm item-card-del" title="删除阶段"
              @click.stop="askDelete(s)" v-html="icon('trash', 14)"></button>
          </div>
        </div>
        <div v-else class="empty">
          <div class="empty-icon" v-html="icon('list', 22)"></div>
          <div class="empty-title">还没有阶段</div>
          <div class="btn-row" style="justify-content:center">
            <button type="button" class="btn btn-primary" @click="openCreate">新建阶段</button>
          </div>
        </div>
        <div class="list-pager" v-if="pages > 1">
          <button type="button" class="btn btn-ghost btn-sm" :disabled="page <= 1"
            @click="goPage(page - 1)" v-html="icon('back', 13)"></button>
          <span class="muted num">{{ page }} / {{ pages }}</span>
          <button type="button" class="btn btn-ghost btn-sm" :disabled="page >= pages" @click="goPage(page + 1)">
            <span class="flip-x" v-html="icon('back', 13)"></span>
          </button>
        </div>

        <!-- 最近的卷 -->
        <div class="table-card" v-if="recentPapers.length" style="margin-top:12px">
          <div class="table-head">
            <h2>最近的卷</h2>
            <span class="sub">非刷题卷</span>
          </div>
          <table class="data-table">
            <thead>
              <tr>
                <th>卷</th>
                <th>模式</th>
                <th>题量</th>
                <th>档位构成</th>
                <th>状态</th>
                <th>得分</th>
                <th>创建</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="p in recentPapers" :key="p.id">
                <td><span class="t-title">{{ p.topic }}</span> <span class="muted">· 第 {{ p.sequence }} 张</span></td>
                <td class="muted">{{ modeLabel(p.compositionMode) }}</td>
                <td class="mono">{{ p.questionCount }}</td>
                <td class="muted">基础 {{ p.tierBase }} · 中档 {{ p.tierMid }} · 大题 {{ p.tierMajor }}</td>
                <td><span class="status" :class="statusCls(p.status)">{{ statusLabel(p.status) }}</span></td>
                <td><span class="score" :class="scoreCls(p.score)">{{ fmtScore(p.score) }}</span></td>
                <td class="muted">{{ fmtTime(p.updatedAt) }}</td>
              </tr>
            </tbody>
          </table>
          <div class="table-foot">
            <div class="grow"></div>
            <span class="mono">1 - {{ recentPapers.length }}</span>
          </div>
        </div>
      </template>

      <!-- 新建阶段弹窗：遮罩点击不关闭（只能 X / 取消关闭），与工作台 formDialog 一致 -->
      <div v-if="createOpen" class="dialog-backdrop">
        <div class="dialog" role="dialog" aria-modal="true">
          <div class="dialog-head">
            <div class="dialog-title" style="justify-content:space-between">
              <span><span v-html="icon('plus', 17)"></span><span>新建阶段</span></span>
              <button type="button" class="dialog-x" aria-label="关闭" @click="closeCreate" v-html="icon('close', 15)"></button>
            </div>
          </div>
          <div class="dialog-body">
            <form id="stage-create-form" @submit.prevent="submitCreate">
              <div class="form-grid">
                <div class="field full">
                  <label>阶段名称 <span class="req">*</span></label>
                  <input type="text" name="name" v-model="createName" ref="createInput"
                    placeholder="例：Java 后端秋招冲刺" />
                </div>
              </div>
            </form>
          </div>
          <div class="dialog-foot">
            <button type="button" class="btn btn-ghost" @click="closeCreate">取消</button>
            <button type="submit" class="btn btn-primary" form="stage-create-form" :disabled="creating">
              <template v-if="creating"><span class="spinner"></span> 创建中…</template>
              <template v-else>创建阶段</template>
            </button>
          </div>
        </div>
      </div>

      <!-- 删除确认：遮罩点击取消，与工作台 confirm 一致 -->
      <div v-if="deleteTarget" class="dialog-backdrop" @click.self="closeDelete">
        <div class="dialog" role="dialog" aria-modal="true">
          <div class="dialog-head">
            <div class="dialog-title"><span v-html="icon('info', 17)"></span> 删除阶段</div>
          </div>
          <div class="dialog-body">该阶段下的练习、试卷与作答会一并删除，且不可恢复。</div>
          <div class="dialog-foot">
            <button type="button" class="btn btn-ghost" @click="closeDelete">取消</button>
            <button type="button" class="btn btn-danger" :disabled="deleting" @click="confirmDelete">删除</button>
          </div>
        </div>
      </div>

      <!-- 退出确认 -->
      <div v-if="logoutOpen" class="dialog-backdrop" @click.self="closeLogout">
        <div class="dialog" role="dialog" aria-modal="true">
          <div class="dialog-head">
            <div class="dialog-title"><span v-html="icon('info', 17)"></span> 退出登录</div>
          </div>
          <div class="dialog-body">退出后需要重新输入用户名和密码。</div>
          <div class="dialog-foot">
            <button type="button" class="btn btn-ghost" @click="closeLogout">取消</button>
            <button type="button" class="btn btn-danger" :disabled="loggingOut" @click="confirmLogout">退出</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/icons.js?v=20261105s"></script>
  <script src="lib/vue/vue.global.prod.js?v=20261117b"></script>
  <script src="js/common.js?v=20261123a"></script>
  <script src="js/stages.js?v=20261123a"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · MyReview</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236366f1'/%3E%3Ctext x='32' y='44' font-size='32' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3EM%3C/text%3E%3C/svg%3E" />
  <!-- 复用工作台的公共样式（设计变量 / .btn / .form-grid / .toast / .spinner）；
       .content + body.auth-mode 直接复刻原来登录页在工作台里的铺满居中布局 -->
  <link rel="stylesheet" href="css/app.css?v=20261117d" />
</head>
<body class="auth-mode">
  <div class="content">
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-brand">
          <h1>myreview</h1>
          <p>面试练习工作台</p>
        </div>
        <div class="seg login-seg" id="auth-seg">
          <button type="button" data-value="login" class="active">登录</button>
          <button type="button" data-value="register">注册</button>
        </div>
        <form id="login-form">
          <div class="form-grid">
            <div class="field full">
              <label>用户名</label>
              <input type="text" name="username" autocomplete="username" placeholder="3-32 位字母、数字或中文" />
            </div>
            <div class="field full">
              <label>密码</label>
              <input type="password" name="password" autocomplete="current-password" placeholder="••••••••" />
            </div>
          </div>
          <div class="btn-row">
            <button type="submit" class="btn login-btn">登录</button>
          </div>
        </form>
        <form id="register-form" style="display:none">
          <div class="form-grid">
            <div class="field full">
              <label>用户名</label>
              <input type="text" name="username" autocomplete="username" placeholder="3-32 位字母、数字或中文" />
            </div>
            <div class="field full">
              <label>密码 <span class="req">*</span></label>
              <input type="password" name="password" autocomplete="new-password" placeholder="至少 8 位，需含字母和数字" />
            </div>
            <div class="field full">
              <label>确认密码 <span class="req">*</span></label>
              <input type="password" name="password2" autocomplete="new-password" placeholder="再输一遍" />
            </div>
          </div>
          <div class="btn-row">
            <button type="submit" class="btn login-btn">注册并登录</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/login.js?v=20261117a"></script>
</body>
</html>

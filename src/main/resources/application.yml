server:
  port: 8080
  servlet:
    session:
      # 学习工具每天用，7 天免登录；配合 cookie 的 http-only + same-site
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
        # secure: true  ← 部署到 HTTPS 时打开
        max-age: 7d

spring:
  application:
    name: my-review
  # 静态资源（css/js）不缓存，避免改完前端后浏览器还在用旧文件
  web:
    resources:
      cache:
        period: 0
  # 语音上传：3 分钟 16kHz 单声道 PCM16 约 5.8MB，默认的 1MB 会把长录音挡在门外
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  # 多用户存储：PostgreSQL（环境变量可覆盖，默认连本机）
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/m_review}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 8
  # schema.sql 全用 CREATE TABLE IF NOT EXISTS，幂等，每次启动安全执行
  sql:
    init:
      mode: always

logging:
  level:
    com.review.vt: DEBUG
    # LLM 工具循环细节开 DEBUG 看每轮调用
    com.review.vt.service.LlmService: DEBUG

myreview:
  # 登录 token 有效期（小时），默认 6 小时
  auth:
    token-ttl-hours: ${TOKEN_TTL_HOURS:6}
  # ========== 运行时文件目录（静态资源统一放 E 盘，不入仓库） ==========
  # master.key / avatars/ / backup/ / models/ 都在这里；环境变量 MYREVIEW_DATA_DIR 可覆盖
  data-dir: ${MYREVIEW_DATA_DIR:E:/m_review}
  # 加密主密钥文件（32 随机字节，首次启动自动生成）
  master-key-file: ${MYREVIEW_MASTER_KEY_FILE:E:/m_review/master.key}
  # LLM 默认配置（用户各自覆盖 apiKey；apiBase/模型/协议为服务端级）
  # 环境变量可覆盖：LLM_API_BASE / LLM_MODEL / LLM_API_FORMAT / LLM_TEMPERATURE
  # anthropic（POST {api-base}/v1/messages，x-api-key）
  # openai   （POST {api-base}/v1/chat/completions，Bearer；DeepSeek/Ollama 等兼容端点）
  llm:
    api-base: ${LLM_API_BASE:https://api.xiaomimimo.com/anthropic}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:mimo-v2.6-pro}
    api-format: ${LLM_API_FORMAT:anthropic}
    temperature: ${LLM_TEMPERATURE:1.0}
  # 语音转文字：sherpa-onnx + paraformer-zh（Apache 2.0，本地识别，不联网）
  speech:
    model-dir: ${SPEECH_MODEL_DIR:E:/m_review/models/paraformer-zh}
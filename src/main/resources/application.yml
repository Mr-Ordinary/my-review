server:
  port: 8080

spring:
  application:
    name: my-review
  # 语音上传：3 分钟 16kHz 单声道 PCM16 约 5.8MB，默认的 1MB 会把长录音挡在门外
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

logging:
  level:
    com.review.vt: INFO
    # LLM 工具循环细节开 DEBUG 看每轮调用
    com.review.vt.service.LlmService: DEBUG

myreview:
  # 本地配置文件（系统设置页保存到这里），缺省值取下面的 llm 配置
  settings-file: ./data/settings.json
  # 本地 JSON 数据存储目录：一表一文件（stages/practices/questions/attempts.json）
  store-dir: ./data/store
  # LLM 接口协议：anthropic（POST {api-base}/v1/messages，x-api-key）
  #              openai   （POST {api-base}/v1/chat/completions，Bearer；DeepSeek/Ollama 等兼容端点）
  llm:
    api-base: https://api.xiaomimimo.com/anthropic
    api-key: ""
    model: mimo-v2.6-pro
    api-format: anthropic
    temperature: 1.0
  # 语音转文字：sherpa-onnx + paraformer-zh（Apache 2.0，本地识别，不联网）
  speech:
    model-dir: ./data/models/paraformer-zh
